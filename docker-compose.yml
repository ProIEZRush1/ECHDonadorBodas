services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "true"
      QUEUE_CONNECTION: database
      DB_HOST: db
      CACHE_STORE: database
      SESSION_DRIVER: database
    expose: ["8000"]
    volumes: ["app_storage:/var/www/html/storage"]
    networks: [coolify]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/login"]
      interval: 15s
      timeout: 5s
      retries: 8

  queue:
    build: .
    restart: unless-stopped
    command: php artisan queue:work database --sleep=3 --tries=3 --timeout=3600
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
      QUEUE_CONNECTION: database
      DB_HOST: db
      CACHE_STORE: database
      SESSION_DRIVER: database
    volumes: ["app_storage:/var/www/html/storage"]
    networks: [coolify]
    depends_on:
      app: {condition: service_healthy}

  scheduler:
    build: .
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
      QUEUE_CONNECTION: database
      DB_HOST: db
      CACHE_STORE: database
      SESSION_DRIVER: database
    volumes: ["app_storage:/var/www/html/storage"]
    networks: [coolify]
    depends_on:
      app: {condition: service_healthy}

  db:
    image: mariadb:11.4
    restart: unless-stopped
    env_file: .env
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes: ["db_data:/var/lib/mysql"]
    networks: [coolify]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app_storage:
  db_data:

networks:
  coolify:
    external: true
