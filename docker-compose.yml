services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "true"
      QUEUE_CONNECTION: database
    expose: ["8000"]
    volumes: ["app_storage:/var/www/html/storage"]
    networks: [coolify]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/login"]
      interval: 15s
      timeout: 5s
      retries: 8

  queue:
    build: .
    restart: unless-stopped
    command: php artisan queue:work database --sleep=3 --tries=3 --timeout=3600
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
      QUEUE_CONNECTION: database
    volumes: ["app_storage:/var/www/html/storage"]
    networks: [coolify]
    depends_on:
      app: {condition: service_healthy}

  scheduler:
    build: .
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
      QUEUE_CONNECTION: database
    volumes: ["app_storage:/var/www/html/storage"]
    networks: [coolify]
    depends_on:
      app: {condition: service_healthy}

volumes:
  app_storage:

networks:
  coolify:
    external: true
